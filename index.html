<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="./src/style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>semester-project-2026</title>
</head>

<body>
  <header>
    <button id="theme-btn" class="items-center mr-4 absolute right-2 lg:right-8">
      <img id="sun-icon" src="../src/assets/sun.svg" />
      <img id="moon-icon" src="../src/assets/moon.svg" class="hidden" />
    </button>
    <button id="sidebar-toggle" type="button" class=" lg:hidden" aria-label="sidebar with account details"
      aria-controls="sidebar-root" aria-expanded="false" hidden>
      <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="30" height="30"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"
        stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-pig-money">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M15 11v.01" />
        <path d="M5.173 8.378a3 3 0 1 1 4.656 -1.377" />
        <path
          d="M16 4v3.803a6.019 6.019 0 0 1 2.658 3.197h1.341a1 1 0 0 1 1 1v2a1 1 0 0 1 -1 1h-1.342c-.336 .95 -.907 1.8 -1.658 2.473v2.027a1.5 1.5 0 0 1 -3 0v-.583a6.04 6.04 0 0 1 -1 .083h-4a6.04 6.04 0 0 1 -1 -.083v.583a1.5 1.5 0 0 1 -3 0v-2l0 -.027a6 6 0 0 1 4 -10.473h2.5l4.5 -3" />
      </svg>
    </button>
  </header>
  <main
    class="grid grid-cols-1 md:grid-cols-[1fr_auto_1fr] lg:justify-between xl:grid-cols-[250px_auto_300px] items-start my-4 mx-4 gap-4">
    <div class="hidden md:block"></div>
    <section class="">
      <ul id="cards-parent">

      </ul>
   <div class="my-12 flex justify-center gap-4 md:gap-20 md:text-xl">
      <button id="prev-btn"
        class="bg-primary text-light-text hover:bg-primary-hover mx-8 my-4 rounded-md px-5 py-1 text-center active:translate-y-1 md:px-4 md:py-3">
        Previous Page
      </button>
      <button id="next-btn"
        class="bg-primary text-light-text hover:bg-primary-hover mx-8 my-4 rounded-md px-5 py-1 text-center active:translate-y-1 md:px-4 md:py-3">
        Next Page
      </button>
    </div>
    </section>


    <aside data-open="false" aria-label="Account summary and active listings" id="sidebar-root" class="
      max-lg:gap-4
      lg:w-70
      max-xl:w-80
      max-lg:fixed 
      max-lg:transition-[translate,visibility] 
      max-lg:duration-300 
      max-lg:ease-out 
      max-lg:motion-reduce:transition-none 
      max-lg:data-[open=false]:translate-x-[110%] 
      max-lg:data-[open=false]:invisible
      right-2
      lg:ml-2
      lg:sticky 
      lg:top-4
      lg:right-8 
      lg:gap-8 
      grid 
      grid-rows-[125px_400px] 
    ">
      <!-- Sidebar renders here  -->
    </aside>


  </main>
  <script type="module" src="./src/components/pagination.ts"></script>
  <script type="module" src="./src/pages/homepage.ts"></script>
  <script type="module" src="./src/components/header.ts"></script>
  <script type="module" src="./src/components/sidebar.ts"></script>
  <script type="module" src="./src/main.ts"></script>
</body>

</html>
